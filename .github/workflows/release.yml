name: Publish action release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "version without prefix v ex: 1.2.3"
        required: true
        type: string
      source_ref:
        description: "branch or commit to publish"
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 #v5

      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the format X.Y.Z, for example 1.2.3"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build action bundle
        run: |
          rm -rf lib dist
          mise run build
          test -s dist/index.js

      - name: Create release commit and tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
                    
          git add -f dist/
          git commit -m "chore(release): v${VERSION}"

          RELEASE_SHA="$(git rev-parse HEAD)"
          git tag -a "v${VERSION}" "$RELEASE_SHA" -m "Release v${VERSION}"
          git push origin "refs/tags/v${VERSION}"

          MAJOR="${VERSION%%.*}"
          git tag -f "v${MAJOR}" "$RELEASE_SHA"
          git push --force origin "refs/tags/v${MAJOR}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v${VERSION}" --generate-notes
