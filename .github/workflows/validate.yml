name: Quality checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 #v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Oxlint
        run: mise run validate:prod

  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 #v5

      - name: Audit GitHub Actions
        run: zizmor --offline --strict-collection --format=github --no-exit-codes .
