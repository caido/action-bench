name: Quality checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Oxlint
        run: mise run validate:prod

  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Audit GitHub Actions
        run: zizmor --offline --strict-collection --format=github --no-exit-codes .
